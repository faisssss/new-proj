apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - github.com/GoogleCloudPlatform/microservices-demo/kustomize/base?ref=v0.10.7

# Turn on tracing in the seven services that support it at this version.
# adservice, cartservice and shippingservice send no spans of their own, so
# their signals have to come from the client spans of the services calling them.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: checkoutservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - {name: ENABLE_TRACING, value: "1"}
                  - {name: COLLECTOR_SERVICE_ADDR, value: "otel-collector.monitoring:4317"}
                  - {name: OTEL_SERVICE_NAME, value: checkoutservice}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: currencyservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - {name: ENABLE_TRACING, value: "1"}
                  - {name: COLLECTOR_SERVICE_ADDR, value: "otel-collector.monitoring:4317"}
                  - {name: OTEL_SERVICE_NAME, value: currencyservice}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: emailservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - {name: ENABLE_TRACING, value: "1"}
                  - {name: COLLECTOR_SERVICE_ADDR, value: "otel-collector.monitoring:4317"}
                  - {name: OTEL_SERVICE_NAME, value: emailservice}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - {name: ENABLE_TRACING, value: "1"}
                  - {name: COLLECTOR_SERVICE_ADDR, value: "otel-collector.monitoring:4317"}
                  - {name: OTEL_SERVICE_NAME, value: frontend}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paymentservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - {name: ENABLE_TRACING, value: "1"}
                  - {name: COLLECTOR_SERVICE_ADDR, value: "otel-collector.monitoring:4317"}
                  - {name: OTEL_SERVICE_NAME, value: paymentservice}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: productcatalogservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - {name: ENABLE_TRACING, value: "1"}
                  - {name: COLLECTOR_SERVICE_ADDR, value: "otel-collector.monitoring:4317"}
                  - {name: OTEL_SERVICE_NAME, value: productcatalogservice}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: recommendationservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - {name: ENABLE_TRACING, value: "1"}
                  - {name: COLLECTOR_SERVICE_ADDR, value: "otel-collector.monitoring:4317"}
                  - {name: OTEL_SERVICE_NAME, value: recommendationservice}
